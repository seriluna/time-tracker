<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><meta name="description" content="개인 시간 계획과 실제 기록"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./style.css"><title>시간 기록</title></head><body><header><div><p class="muted">MY DAILY SYSTEM</p><h1>시간 기록</h1></div><div class="backup-actions"><button id="export">JSON 백업</button><button id="csvExport">CSV 내보내기</button><button id="importBtn">백업 복원</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></header><section class="datebar"><button id="prev">‹</button><input id="day" type="date"><button id="next">›</button><button id="today">오늘</button></section><nav class="tabs"><button class="active" data-tab="record">기록</button><button data-tab="todo">할 일</button><button data-tab="stats">분석</button></nav><section id="recordPanel" class="panel"><div class="goalbox"><label for="goalHours">하루 실제 기록 목표 (시간)</label><div class="goalcontrols"><input id="goalHours" type="number" min="0.5" max="24" step="0.5" value="8"><span id="goalLabel">목표 8시간</span></div><div class="progress"><div id="goalProgress"></div></div><p id="goalMessage" class="muted">실제 기록을 목표와 비교합니다.</p></div><div class="summary"><div><span>계획 시간</span><strong id="planned">0분</strong></div><div><span>실제 시간</span><strong id="actual">0분</strong></div><div><span>기록 개수</span><strong id="count">0</strong></div></div><h2>시간 기록 추가</h2><form id="entryForm" class="form"><label>활동 이름<input id="name" maxlength="80" placeholder="예: 운동, 업무, 독서" required></label><div class="two"><label>시작 시간<input id="start" type="time" value="09:00" required></label><label>종료 시간<input id="end" type="time" value="10:00" required></label></div><div class="two"><label>종류<select id="kind"><option value="actual">실제 기록</option><option value="planned">계획</option></select></label><label>분류<input id="cat" maxlength="30" placeholder="예: 건강"></label></div><label>메모 (선택)<input id="note" maxlength="200" placeholder="간단한 메모"></label><div class="form-actions"><button class="primary" id="saveEntry" type="submit">기록 저장</button><button id="cancelEdit" type="button" hidden>수정 취소</button></div></form><h2>오늘의 타임라인</h2><div id="entries" class="entries"></div></section><section id="todoPanel" class="panel hidden"><h2>할 일 목록</h2><form id="todoForm" class="inlineform"><input id="todoText" maxlength="160" placeholder="해야 할 일 추가" required><button class="primary" type="submit">추가</button></form><div id="todos" class="entries"></div></section><section id="statsPanel" class="panel hidden"><h2>분석</h2><p class="muted">선택한 날짜의 분류별 시간과 주간·월간 실행 기록을 확인합니다.</p><div id="stats"></div><h2>주간 요약</h2><div id="weekStats"></div><h2>월간 요약</h2><div id="monthStats"></div></section><footer>기록은 이 기기에 저장됩니다. 정기적으로 백업해 주세요.</footer><script src="./app.js"></script><script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
